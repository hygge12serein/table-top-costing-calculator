<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Labour Cost Config</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-800 min-h-screen py-8 px-4 lg:px-8 flex flex-col justify-between">

  <div class="max-w-7xl mx-auto space-y-6 w-full">
    <header class="flex flex-col md:flex-row md:items-center md:justify-between bg-emerald-800 text-white rounded-2xl p-6 shadow-xl gap-4">
      <div>
        <h1 class="text-2xl font-bold">Labour Cost Config</h1>
        <p class="text-emerald-200 text-xs mt-1">Manage operational service descriptions and labour costs</p>
      </div>
      <a href="config-index.html" class="inline-flex items-center gap-2 bg-emerald-700 hover:bg-emerald-600 text-white px-4 py-2 rounded-lg text-xs font-semibold">
        <i data-lucide="arrow-left" class="w-4 h-4"></i> Back to Config Index
      </a>
    </header>

    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden p-4 sm:p-6 space-y-4">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div class="relative max-w-xs w-full">
          <i data-lucide="search" class="w-4 h-4 absolute left-3 top-3 text-slate-400"></i>
          <input type="text" id="searchInput" oninput="handleSearch()" placeholder="Search service name..." class="w-full bg-slate-50 border border-slate-300 rounded-lg pl-9 pr-3 py-2 text-xs focus:ring-2 focus:ring-emerald-500 focus:outline-none">
        </div>
        <button onclick="openModal()" class="inline-flex items-center gap-1.5 bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-xs font-semibold">
          <i data-lucide="plus" class="w-4 h-4"></i> Add Labour Cost
        </button>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs sm:text-sm whitespace-nowrap">
          <thead class="bg-slate-100 text-slate-600 text-xs font-semibold uppercase tracking-wider">
            <tr>
              <th onclick="handleSort('service_name')" class="p-3 cursor-pointer hover:bg-slate-200">Service Name <span id="sort-service_name"></span></th>
              <th onclick="handleSort('cost')" class="p-3 text-right cursor-pointer hover:bg-slate-200">Cost (RM) <span id="sort-cost"></span></th>
              <th onclick="handleSort('is_active')" class="p-3 text-center cursor-pointer hover:bg-slate-200">Status <span id="sort-is_active"></span></th>
              <th onclick="handleSort('updated_at')" class="p-3 cursor-pointer hover:bg-slate-200">Updated At <span id="sort-updated_at"></span></th>
              <th class="p-3 text-center">Actions</th>
            </tr>
          </thead>
          <tbody id="tableBody" class="divide-y divide-slate-100"></tbody>
        </table>
      </div>

      <div class="flex flex-col sm:flex-row items-center justify-between gap-4 pt-2 border-t border-slate-100 text-xs text-slate-500">
        <span id="pageInfo">Showing 0 to 0 of 0 items</span>
        <div class="flex items-center gap-2">
          <button id="prevBtn" onclick="changePage(-1)" class="px-3 py-1.5 border border-slate-300 rounded-lg disabled:opacity-50">Previous</button>
          <span id="pageCurrent" class="font-bold text-slate-800">1</span>
          <button id="nextBtn" onclick="changePage(1)" class="px-3 py-1.5 border border-slate-300 rounded-lg disabled:opacity-50">Next</button>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL -->
  <div id="modal" class="fixed inset-0 bg-slate-900/50 hidden items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl">
      <h3 class="text-lg font-bold text-slate-900" id="modalTitle">Edit Labour Cost</h3>
      <input type="hidden" id="labourGuid">
      <div class="space-y-3 text-xs">
        <div>
          <label class="block font-medium text-slate-600 mb-1">Service Name</label>
          <input type="text" id="labourServiceName" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5">
        </div>
        <div>
          <label class="block font-medium text-slate-600 mb-1">Cost (RM)</label>
          <input type="number" step="0.01" id="labourCost" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5">
        </div>
        <div>
          <label class="block font-medium text-slate-600 mb-1">Is Active</label>
          <select id="labourActive" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5">
            <option value="1">Active</option>
            <option value="0">Inactive</option>
          </select>
        </div>
      </div>
      <div class="flex justify-end gap-2 pt-2">
        <button onclick="closeModal()" class="px-4 py-2 bg-slate-200 rounded-lg text-xs font-semibold">Cancel</button>
        <button onclick="saveData()" class="px-4 py-2 bg-emerald-600 rounded-lg text-xs font-semibold text-white">Save Changes</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://hjdxqocqqkvoeligumfv.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhqZHhxb2NxcWt2b2VsaWd1bWZ2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3NzUzOTgsImV4cCI6MjEwNDM1MTM5OH0.WORFmgT27jDuUKEX5eG8vB8aJL5tFl0eC01skJnBImo';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let rawData = [], filteredData = [];
    let sortColumn = 'service_name', sortAsc = true;
    let currentPage = 1, pageSize = 8;

    function generateGuid() { return crypto.randomUUID().replace(/-/g, '').toUpperCase(); }
    const fmtCurr = (num) => `RM ${(parseFloat(num) || 0).toFixed(2)}`;

    async function loadData() {
      const { data, error } = await supabaseClient.from('labour_cost').select('*');
      if (error) return alert('Load failed: ' + error.message);
      rawData = data || [];
      applyFilters();
    }

    function applyFilters() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      filteredData = rawData.filter(r => (r.service_name || '').toLowerCase().includes(query));

      filteredData.sort((a, b) => {
        let valA = a[sortColumn], valB = b[sortColumn];
        if (typeof valA === 'string') valA = valA.toLowerCase();
        if (typeof valB === 'string') valB = valB.toLowerCase();
        if (valA < valB) return sortAsc ? -1 : 1;
        if (valA > valB) return sortAsc ? 1 : -1;
        return 0;
      });

      renderTable();
    }

    function renderTable() {
      const total = filteredData.length;
      const start = (currentPage - 1) * pageSize;
      const pageRows = filteredData.slice(start, start + pageSize);

      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = pageRows.length === 0 
        ? `<tr><td colspan="5" class="p-4 text-center text-slate-400">No records found.</td></tr>`
        : pageRows.map(row => `
          <tr class="hover:bg-slate-50">
            <td class="p-3 font-medium text-slate-800">${row.service_name}</td>
            <td class="p-3 text-right font-mono font-bold text-emerald-700">${fmtCurr(row.cost)}</td>
            <td class="p-3 text-center">
              <span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${row.is_active ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}">
                ${row.is_active ? 'Active' : 'Inactive'}
              </span>
            </td>
            <td class="p-3 text-slate-400 text-xs">${new Date(row.updated_at).toLocaleString()}</td>
            <td class="p-3 text-center">
              <button onclick="openModal('${row.guid}')" class="text-emerald-600 hover:text-emerald-800 font-semibold p-1">Edit</button>
            </td>
          </tr>
        `).join('');

      document.getElementById('pageInfo').innerText = `Showing ${total === 0 ? 0 : start + 1} to ${Math.min(start + pageSize, total)} of ${total} items`;
      document.getElementById('pageCurrent').innerText = currentPage;
      document.getElementById('prevBtn').disabled = currentPage === 1;
      document.getElementById('nextBtn').disabled = start + pageSize >= total;

      ['service_name', 'cost', 'is_active', 'updated_at'].forEach(col => {
        const el = document.getElementById(`sort-${col}`);
        if (el) el.innerText = sortColumn === col ? (sortAsc ? '▲' : '▼') : '';
      });
    }

    function handleSearch() { currentPage = 1; applyFilters(); }
    function handleSort(col) {
      if (sortColumn === col) sortAsc = !sortAsc;
      else { sortColumn = col; sortAsc = true; }
      applyFilters();
    }
    function changePage(delta) { currentPage += delta; renderTable(); }

    function openModal(guid = null) {
      document.getElementById('modal').classList.remove('hidden');
      document.getElementById('modal').classList.add('flex');
      if (guid) {
        const item = rawData.find(r => r.guid === guid);
        document.getElementById('modalTitle').innerText = 'Edit Labour Cost';
        document.getElementById('labourGuid').value = item.guid;
        document.getElementById('labourServiceName').value = item.service_name;
        document.getElementById('labourCost').value = item.cost;
        document.getElementById('labourActive').value = item.is_active;
      } else {
        document.getElementById('modalTitle').innerText = 'Add New Labour Cost';
        document.getElementById('labourGuid').value = '';
        document.getElementById('labourServiceName').value = '';
        document.getElementById('labourCost').value = '';
        document.getElementById('labourActive').value = '1';
      }
    }

    function closeModal() {
      document.getElementById('modal').classList.add('hidden');
      document.getElementById('modal').classList.remove('flex');
    }

    async function saveData() {
      const guid = document.getElementById('labourGuid').value;
      const payload = {
        service_name: document.getElementById('labourServiceName').value.trim(),
        cost: parseFloat(document.getElementById('labourCost').value) || 0,
        is_active: parseInt(document.getElementById('labourActive').value),
        updated_at: new Date().toISOString()
      };

      let error;
      if (guid) {
        ({ error } = await supabaseClient.from('labour_cost').update(payload).eq('guid', guid));
      } else {
        payload.guid = generateGuid();
        ({ error } = await supabaseClient.from('labour_cost').insert([payload]));
      }

      if (error) alert('Error: ' + error.message);
      else { closeModal(); loadData(); }
    }

    lucide.createIcons();
    loadData();
  </script>
</body>
</html>
